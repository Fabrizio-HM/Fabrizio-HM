name: Developer Activity Stats
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate statistics
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity_stats.py
      - name: Generate combined contribution snake
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/combined_snake.py
      - name: Generate GitHub language chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/language_stats.py
      - name: Publish SVGs to activity-stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: activity-stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
